<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leon Shop | ليون ستور</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* إعدادات الألوان والفخامة المستوحاة من الشعار */
        :root {
            --bg-dark: #0b0b0b;
            --bg-card: #141414;
            --gold: #d4af37;
            --gold-glow: #f3e5ab;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* الهيدر العلوي */
        header {
            background-color: rgba(20, 20, 20, 0.95);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding: 15px 5%;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* تصميم الشعار المطور بشكل دائري فخم */
        .logo-img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--gold);
        }

        .logo-text {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
            background: linear-gradient(45deg, var(--gold), var(--gold-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--gold);
        }

        /* البنر الترحيبي العريض */
        .hero-section {
            text-align: center;
            padding: 60px 20px;
            background: radial-gradient(circle, rgba(40,30,10,1) 0%, rgba(11,11,11,1) 70%);
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
        }

        .hero-section h1 {
            font-size: 40px;
            margin-bottom: 15px;
            color: #fff;
        }

        .hero-section h1 span {
            color: var(--gold);
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
        }

        .hero-section p {
            color: var(--text-muted);
            font-size: 18px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* الحاوية الأساسية للمنتجات */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 28px;
            margin-bottom: 30px;
            border-right: 4px solid var(--gold);
            padding-right: 15px;
            color: var(--text-main);
        }

        /* شبكة المنتجات */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        /* كرت المنتج الفخم بتأثير زجاجي مضيء */
        .product-card {
            background-color: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.15);
        }

        /* شارة التوثيق أو الضمان للمنتجات الرقمية */
        .badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: rgba(0, 0, 0, 0.75);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 20px;
            font-weight: bold;
            z-index: 1;
        }

        .product-img-wrapper {
            width: 100%;
            height: 200px;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            color: rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }

        /* خلفيات افتراضية فخمة للألعاب */
        .bg-fortnite { background: linear-gradient(135deg, #150030, #310062); }
        .bg-rocket { background: linear-gradient(135deg, #001f4d, #004080); }
