<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leon Shop</title>

<style>
:root{
    --bg:#0a0a0a;
    --card:#111111;
    --gold:#dfb74c;
    --gold2:#f7d77a;
    --text:#ffffff;
    --green:#25D366;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

header{
    padding:25px;
    border-bottom:1px solid rgba(223,183,76,.2);
    background:#080808;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    display:flex;
    align-items:center;
    gap:15px;
    justify-content:center;
}

.logo-icon{
    width:60px;
    height:60px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--gold),#8d6a12);
    box-shadow:0 0 25px rgba(223,183,76,.4);
}

.logo h1{
    color:var(--gold);
    font-size:2rem;
}

main{
    width:95%;
    max-width:1400px;
    margin:auto;
    padding:30px 0;
}

.section-title{
    text-align:center;
    color:var(--gold);
    font-size:2rem;
    margin-bottom:30px;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

.product-card{
    background:var(--card);
    border:1px solid rgba(223,183,76,.15);
    border-radius:20px;
    padding:20px;
    cursor:pointer;
    transition:.3s;
    position:relative;
    overflow:hidden;
}

.product-card:hover{
    transform:translateY(-5px);
    border-color:var(--gold);
    box-shadow:0 0 25px rgba(223,183,76,.15);
}

.badge{
    background:var(--gold);
    color:black;
    display:inline-block;
    padding:6px 12px;
    border-radius:50px;
    font-size:.8rem;
    font-weight:bold;
    margin-bottom:12px;
}

.product-name{
    font-size:1.3rem;
    color:var(--gold2);
    margin-bottom:10px;
}

.product-desc{
    opacity:.8;
    margin-bottom:15px;
    line-height:1.6;
}

.price{
    font-size:1.4rem;
    color:var(--gold);
    font-weight:bold;
}

.add-product{
    display:block;
    margin:35px auto;
    background:linear-gradient(135deg,var(--gold),#8d6a12);
    color:black;
    border:none;
    padding:15px 30px;
    border-radius:50px;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
}

.add-product:hover{
    transform:scale(1.05);
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    visibility:hidden;
    transition:.3s;
    z-index:999;
}

.modal.active{
    opacity:1;
    visibility:visible;
}

.modal-content{
    width:90%;
    max-width:500px;
    background:#111;
    border:2px solid var(--gold);
    border-radius:25px;
    padding:30px;
    position:relative;
    transform:scale(0);
    border-radius:50%;
    aspect-ratio:1/1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.modal.active .modal-content{
    animation:circleOpen .5s ease forwards;
}

@keyframes circleOpen{
    from{
        transform:scale(0);
        border-radius:50%;
    }
    to{
        transform:scale(1);
        border-radius:30px;
    }
}

.close{
    position:absolute;
    top:15px;
    left:15px;
    font-size:30px;
    cursor:pointer;
    color:white;
}

.buy-btn{
    margin-top:20px;
    background:var(--green);
    color:white;
    text-decoration:none;
    padding:15px 30px;
    border-radius:50px;
    font-weight:bold;
}

.buy-btn:hover{
    transform:scale(1.05);
}

[contenteditable="true"]{
    outline:none;
}

[contenteditable="true"]:focus{
    box-shadow:0 0 0 2px var(--gold);
    border-radius:6px;
}

@media(max-width:600px){
    .logo h1{
        font-size:1.5rem;
    }

    .section-title{
        font-size:1.6rem;
    }
}
</style>
</head>
<body>

<header>
    <div class="logo">
        <div class="logo-icon" contenteditable="true"></div>
        <h1 contenteditable="true">Leon Shop</h1>
    </div>
</header>

<main>

    <h2 class="section-title" contenteditable="true">
        الحسابات النادرة
    </h2>

    <div class="product-grid" id="productGrid">

        <div class="product-card">
            <div class="badge" contenteditable="true">نادر</div>

            <div class="product-name" contenteditable="true">
                حساب فورتنايت OG
            </div>

            <div class="product-desc" contenteditable="true">
                يحتوي على سكنات نادرة ومستوى مرتفع.
            </div>

            <div class="price" contenteditable="true">
                25 د.ك
            </div>
        </div>

        <div class="product-card">
            <div class="badge" contenteditable="true">حصري</div>

            <div class="product-name" contenteditable="true">
                حساب فالورانت
            </div>

            <div class="product-desc" contenteditable="true">
                رانك عالي وسكنات مميزة.
            </div>

            <div class="price" contenteditable="true">
                18 د.ك
            </div>
        </div>

    </div>

    <button class="add-product" id="addProduct">
        + إضافة حساب جديد
    </button>

</main>

<div class="modal" id="modal">
    <div class="modal-content">

        <span class="close" id="closeModal">×</span>

        <h2 id="modalName"></h2>
        <p id="modalDesc"></p>
        <h3 id="modalPrice"></h3>

        <a
        href="https://wa.me/96500000000"
        target="_blank"
        class="buy-btn">
        شراء عبر واتساب
        </a>

    </div>
</div>

<script>

const modal = document.getElementById("modal");
const modalName = document.getElementById("modalName");
const modalDesc = document.getElementById("modalDesc");
const modalPrice = document.getElementById("modalPrice");

function bindCards(){

    document.querySelectorAll(".product-card").forEach(card=>{

        card.onclick = ()=>{

            modalName.innerText =
            card.querySelector(".product-name").innerText;

            modalDesc.innerText =
            card.querySelector(".product-desc").innerText;

            modalPrice.innerText =
            card.querySelector(".price").innerText;

            modal.classList.add("active");
        };

    });

}

bindCards();

document.getElementById("closeModal").onclick=()=>{
    modal.classList.remove("active");
};

modal.onclick=(e)=>{
    if(e.target===modal){
        modal.classList.remove("active");
    }
};

document.getElementById("addProduct").onclick=()=>{

    const card=document.createElement("div");
    card.className="product-card";

    card.innerHTML=`
        <div class="badge" contenteditable="true">جديد</div>

        <div class="product-name" contenteditable="true">
            اسم الحساب
        </div>

        <div class="product-desc" contenteditable="true">
            وصف الحساب
        </div>

        <div class="price" contenteditable="true">
            0 د.ك
        </div>
    `;

    document.getElementById("productGrid").appendChild(card);

    bindCards();
};

</script>

</body>
</html>
